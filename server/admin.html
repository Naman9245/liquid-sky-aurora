<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0906">
<title>Liquid Sky — Counter</title>
<style>
  :root {
    --bg: #0C0906;
    --surface: #171008;
    --surface-2: #1F1509;
    --line: #382818;
    --text: #F3E9DC;
    --muted: #A6947F;
    --accent: #E07B2E;
    --veg: #7FA653;
    --nonveg: #E0604A;
    --ok: #7FA653;
    --warn: #E0A93C;
    --radius: 14px;
    --tap: 46px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { background: var(--bg); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 var(--font);
    -webkit-text-size-adjust: 100%;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }

  .wrap { max-width: 620px; margin: 0 auto; padding: 0 12px; }

  /* ---------------------------------------------------------------- header */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(12, 9, 6, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .bar {
    display: flex; align-items: center; gap: 10px;
    min-height: 52px;
  }
  .brand {
    font-size: 15px; font-weight: 700; letter-spacing: .01em;
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand span { color: var(--accent); }

  .tabs { display: flex; gap: 6px; padding-bottom: 8px; }
  .tabs button {
    flex: 1; min-height: 40px;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--line); border-radius: 10px;
    font: 600 14px/1 var(--font); cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--accent); border-color: var(--accent); color: #1A0F05;
  }

  /* ----------------------------------------------------------- primitives */
  button, input, select { font-family: var(--font); }

  .btn {
    min-height: var(--tap); padding: 0 14px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font: 600 14px/1 var(--font); cursor: pointer;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #1A0F05; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn:disabled { opacity: .5; }

  .field {
    width: 100%; min-height: var(--tap); padding: 0 12px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 16px; /* 16px stops iOS zooming on focus */
  }
  .field:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .muted { color: var(--muted); }
  .tiny { font-size: 12px; }

  /* --------------------------------------------------------------- login */
  #login { display: none; padding: 14vh 12px 0; }
  #login.on { display: block; }
  .login-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px;
  }
  .login-card h1 { margin: 0 0 4px; font-size: 20px; }
  .login-card p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .login-card .btn { width: 100%; margin-top: 10px; }

  /* ----------------------------------------------------------------- app */
  #app { display: none; }
  #app.on { display: block; }
  .panel { display: none; padding-top: 12px; }
  .panel.on { display: block; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar .field { flex: 1; }

  .summary {
    display: flex; gap: 14px; flex-wrap: wrap;
    padding: 10px 12px; margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    font-size: 13px; color: var(--muted);
  }
  .summary b { color: var(--text); font-size: 15px; }

  /* ------------------------------------------------------- reservations */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
  }
  .card.is-cancelled, .card.is-no_show { opacity: .5; }

  .card-top { display: flex; align-items: baseline; gap: 8px; }
  .time { font: 700 20px/1.1 var(--font); color: var(--accent); font-variant-numeric: tabular-nums; }
  .pill {
    margin-left: auto; padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--line); color: var(--muted); background: var(--surface-2);
  }
  .pill[data-s="confirmed"] { color: var(--ok); border-color: #3C4A2C; }
  .pill[data-s="seated"]    { color: #1A0F05; background: var(--accent); border-color: var(--accent); }
  .pill[data-s="no_show"]   { color: var(--nonveg); border-color: #4A2A24; }
  .pill[data-s="cancelled"] { color: var(--muted); }
  .pill[data-s="pending"]   { color: var(--warn); border-color: #4A3A18; }

  .who { margin: 6px 0 2px; font-size: 17px; font-weight: 600; }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .meta a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .note {
    margin-top: 8px; padding: 8px 10px; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--line);
    font-size: 13px; color: var(--text);
  }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .actions .btn { flex: 1; padding: 0 6px; font-size: 13px; }
  .actions .btn[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #1A0F05;
  }

  /* -------------------------------------------------------------- menu */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 4px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; min-height: 38px; padding: 0 13px;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    font: 600 13px/1 var(--font); cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1A0F05; }

  .row {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
  }
  .row.off { background: #140D06; }
  .row.off .name { text-decoration: line-through; color: var(--muted); }
  .row .name { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    margin-right: 7px; vertical-align: middle;
    border: 1.5px solid var(--veg);
  }
  .dot::after {
    content: ''; display: block; width: 3px; height: 3px; border-radius: 50%;
    background: var(--veg); margin: 1px auto 0;
  }
  .dot.nonveg { border-color: var(--nonveg); }
  .dot.nonveg::after { background: var(--nonveg); }
  .row .cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  .row .controls { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; }
  .price-wrap { display: flex; align-items: center; gap: 4px; }
  .price-wrap .rupee { color: var(--muted); font-size: 15px; }
  .price {
    width: 84px; min-height: 42px; padding: 0 8px; text-align: right;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    font: 600 16px/1 var(--font); font-variant-numeric: tabular-nums;
  }
  .soldout {
    margin-left: auto; min-height: 42px; padding: 0 14px;
    background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--line); border-radius: 9px;
    font: 700 13px/1 var(--font); cursor: pointer; white-space: nowrap;
  }
  .soldout[aria-pressed="true"] {
    background: var(--nonveg); border-color: var(--nonveg); color: #1A0F05;
  }

  .state { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .state.saving { color: var(--muted); }
  .state.saved  { color: var(--ok); }
  .state.failed { color: var(--nonveg); }

  .empty { padding: 40px 12px; text-align: center; color: var(--muted); }
  .err {
    margin: 10px 0; padding: 10px 12px; border-radius: 10px;
    background: #2A1410; border: 1px solid #4A2A24; color: #F0C4BB; font-size: 13px;
  }
  .err:empty { display: none; }

  /* toast */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom));
    background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text); padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
    max-width: calc(100vw - 32px);
  }
  #toast.on { opacity: 1; }
  #toast.bad { border-color: #4A2A24; color: #F0C4BB; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<!-- ------------------------------------------------------------- login -- -->
<section id="login" class="wrap">
  <form class="login-card" id="loginForm">
    <h1>Liquid Sky <span style="color:var(--accent)">Counter</span></h1>
    <p>Staff only. Enter the admin password.</p>
    <input class="field" id="pw" type="password" name="password" autocomplete="current-password"
           placeholder="Password" required aria-label="Admin password">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
  </form>
</section>

<!-- --------------------------------------------------------------- app -- -->
<div id="app">
  <header>
    <div class="wrap">
      <div class="bar">
        <div class="brand">Liquid Sky <span>Counter</span></div>
        <button class="btn btn-ghost" id="logout" style="min-height:34px;padding:0 10px;font-size:13px">Sign out</button>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" id="tabTonight" aria-selected="true" aria-controls="panelTonight">Tonight</button>
        <button role="tab" id="tabMenu" aria-selected="false" aria-controls="panelMenu">Menu</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- ------------------------------------------------------- tonight -- -->
    <section class="panel on" id="panelTonight" role="tabpanel" aria-labelledby="tabTonight">
      <div class="toolbar">
        <input class="field" id="date" type="date" aria-label="Show reservations for date">
        <button class="btn" id="today" style="min-height:46px">Today</button>
      </div>
      <div class="summary" id="resvSummary"></div>
      <div class="err" id="resvErr" role="alert"></div>
      <div id="resvList"></div>
    </section>

    <!-- ---------------------------------------------------------- menu -- -->
    <section class="panel" id="panelMenu" role="tabpanel" aria-labelledby="tabMenu">
      <div class="toolbar">
        <input class="field" id="search" type="search" placeholder="Search 287 items…"
               autocomplete="off" aria-label="Search menu">
      </div>
      <div class="chips" id="chips"></div>
      <div class="summary" id="menuSummary"></div>
      <div class="err" id="menuErr" role="alert"></div>
      <div id="menuList"></div>
    </section>
  </main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------- utils -- */
  var $ = function (id) { return document.getElementById(id); };

  function toast(msg, bad) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'on' + (bad ? ' bad' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, 2200);
  }

  function api(method, path, body) {
    var opts = {
      method: method,
      credentials: 'same-origin',
      headers: { 'Accept': 'application/json' }
    };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch(path, opts).then(function (res) {
      if (res.status === 401) { showLogin(); throw { code: 401, error: 'unauthorised' }; }
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          data.code = res.status;
          if (res.status === 429) data.retryAfter = res.headers.get('Retry-After');
          throw data;
        }
        return data;
      });
    });
  }

  function errText(e) {
    if (!e) return 'Something went wrong.';
    if (e.code === 429) return 'Too many attempts. Try again in ' + (e.retryAfter || 60) + 's.';
    if (e.error === 'invalid_password') return 'Wrong password.';
    if (e.error) return String(e.error).replace(/_/g, ' ');
    return 'Network error — is the server running?';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** slot_at is "2026-09-11T20:30:00+05:30" — read the wall clock straight off it. */
  function prettyTime(slotAt) {
    var hh = parseInt(slotAt.slice(11, 13), 10);
    var mm = slotAt.slice(14, 16);
    var ampm = hh >= 12 ? 'PM' : 'AM';
    var h12 = hh % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + mm + ' ' + ampm;
  }

  function prettyPhone(p) {
    var m = /^\+91(\d{5})(\d{5})$/.exec(p);
    return m ? '+91 ' + m[1] + ' ' + m[2] : p;
  }

  /* -------------------------------------------------------- view state -- */
  function showLogin() {
    $('login').className = 'on wrap';
    $('app').className = '';
    setTimeout(function () { $('pw').focus(); }, 50);
  }

  function showApp() {
    $('login').className = 'wrap';
    $('app').className = 'on';
  }

  /* ------------------------------------------------------------- login -- */
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('loginBtn');
    var err = $('loginErr');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    api('POST', '/api/admin/login', { password: $('pw').value })
      .then(function () {
        $('pw').value = '';
        showApp();
        loadReservations();
        loadMenu();
      })
      .catch(function (e) { err.textContent = errText(e); })
      .then(function () {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      });
  });

  $('logout').addEventListener('click', function () {
    api('POST', '/api/admin/logout').catch(function () {}).then(showLogin);
  });

  /* -------------------------------------------------------------- tabs -- */
  function selectTab(which) {
    var tonight = which === 'tonight';
    $('tabTonight').setAttribute('aria-selected', String(tonight));
    $('tabMenu').setAttribute('aria-selected', String(!tonight));
    $('panelTonight').className = 'panel' + (tonight ? ' on' : '');
    $('panelMenu').className = 'panel' + (tonight ? '' : ' on');
    window.scrollTo(0, 0);
  }
  $('tabTonight').addEventListener('click', function () { selectTab('tonight'); });
  $('tabMenu').addEventListener('click', function () { selectTab('menu'); });

  /* ------------------------------------------------------ reservations -- */
  var STATUS_BUTTONS = [
    { status: 'confirmed', label: 'Confirm' },
    { status: 'seated', label: 'Seated' },
    { status: 'no_show', label: 'No-show' }
  ];

  function renderReservations(data) {
    $('date').value = data.date;

    var list = $('resvList');
    list.textContent = '';

    $('resvSummary').innerHTML =
      '<span><b>' + data.count + '</b> booking' + (data.count === 1 ? '' : 's') + '</span>' +
      '<span><b>' + data.covers + '</b> cover' + (data.covers === 1 ? '' : 's') + ' expected</span>';

    if (!data.reservations.length) {
      list.innerHTML = '<div class="empty">No bookings for this day.</div>';
      return;
    }

    data.reservations.forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'card is-' + r.status;
      card.dataset.id = r.id;

      var html = '';
      html += '<div class="card-top">';
      html += '<span class="time">' + esc(prettyTime(r.slot_at)) + '</span>';
      html += '<span class="pill" data-s="' + esc(r.status) + '">' + esc(r.status.replace('_', ' ')) + '</span>';
      html += '</div>';
      html += '<div class="who">' + esc(r.name) + '</div>';
      html += '<div class="meta">';
      html += '<span><b style="color:var(--text)">' + r.party_size + '</b> guest' + (r.party_size === 1 ? '' : 's') + '</span>';
      html += '<a href="tel:' + esc(r.phone) + '">' + esc(prettyPhone(r.phone)) + '</a>';
      html += '<span class="tiny">' + esc(r.code) + '</span>';
      html += '</div>';
      if (r.note) html += '<div class="note">' + esc(r.note) + '</div>';
      html += '<div class="actions"></div>';
      card.innerHTML = html;

      var actions = card.querySelector('.actions');
      STATUS_BUTTONS.forEach(function (spec) {
        var b = document.createElement('button');
        b.className = 'btn';
        b.type = 'button';
        b.textContent = spec.label;
        b.setAttribute('aria-pressed', String(r.status === spec.status));
        b.addEventListener('click', function () { setStatus(r.id, spec.status, card); });
        actions.appendChild(b);
      });

      list.appendChild(card);
    });
  }

  function setStatus(id, status, card) {
    var buttons = card.querySelectorAll('.actions .btn');
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;

    api('PATCH', '/api/admin/reservations/' + id, { status: status })
      .then(function (r) {
        var pill = card.querySelector('.pill');
        pill.dataset.s = r.status;
        pill.textContent = r.status.replace('_', ' ');
        card.className = 'card is-' + r.status;
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].setAttribute('aria-pressed', String(STATUS_BUTTONS[i].status === r.status));
        }
        toast(r.name + ' → ' + r.status.replace('_', ' '));
      })
      .catch(function (e) { toast(errText(e), true); })
      .then(function () {
        for (var i = 0; i < buttons.length; i++) buttons[i].disabled = false;
      });
  }

  function loadReservations(dateStr) {
    var url = '/api/admin/reservations' + (dateStr ? '?date=' + encodeURIComponent(dateStr) : '');
    $('resvErr').textContent = '';
    $('resvList').innerHTML = '<div class="empty">Loading…</div>';
    api('GET', url)
      .then(renderReservations)
      .catch(function (e) {
        if (e && e.code === 401) return;
        $('resvList').textContent = '';
        $('resvErr').textContent = errText(e);
      });
  }

  $('date').addEventListener('change', function () {
    if (this.value) loadReservations(this.value);
  });
  $('today').addEventListener('click', function () { loadReservations(); });

  /* --------------------------------------------------------------- menu -- */
  var MENU = { items: [], categories: [] };
  var activeCat = 'all';
  var query = '';

  function loadMenu() {
    $('menuErr').textContent = '';
    $('menuList').innerHTML = '<div class="empty">Loading menu…</div>';
    fetch('/api/menu', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        MENU = data;
        $('search').placeholder = 'Search ' + data.items.length + ' items…';
        renderChips();
        renderMenu();
      })
      .catch(function (e) {
        $('menuList').textContent = '';
        $('menuErr').textContent = errText(e);
      });
  }

  function renderChips() {
    var chips = $('chips');
    chips.textContent = '';
    var defs = [{ slug: 'all', label: 'All' }, { slug: '__off', label: 'Sold out' }]
      .concat(MENU.categories);
    defs.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = c.label;
      b.setAttribute('aria-pressed', String(activeCat === c.slug));
      b.addEventListener('click', function () {
        activeCat = c.slug;
        renderChips();
        renderMenu();
      });
      chips.appendChild(b);
    });
  }

  function catLabel(slug) {
    for (var i = 0; i < MENU.categories.length; i++) {
      if (MENU.categories[i].slug === slug) return MENU.categories[i].label;
    }
    return slug;
  }

  function visibleItems() {
    var qq = query.trim().toLowerCase();
    return MENU.items.filter(function (it) {
      if (activeCat === '__off') { if (it.available) return false; }
      else if (activeCat !== 'all' && it.category !== activeCat) return false;
      if (!qq) return true;
      return it.name.toLowerCase().indexOf(qq) >= 0 ||
             catLabel(it.category).toLowerCase().indexOf(qq) >= 0;
    });
  }

  function renderMenu() {
    var items = visibleItems();
    var soldOut = MENU.items.filter(function (i) { return !i.available; }).length;

    $('menuSummary').innerHTML =
      '<span>showing <b>' + items.length + '</b> of ' + MENU.items.length + '</span>' +
      '<span><b>' + soldOut + '</b> sold out</span>';

    var list = $('menuList');
    list.textContent = '';
    if (!items.length) {
      list.innerHTML = '<div class="empty">Nothing matches that search.</div>';
      return;
    }

    var frag = document.createDocumentFragment();
    items.forEach(function (it) { frag.appendChild(menuRow(it)); });
    list.appendChild(frag);
  }

  function menuRow(it) {
    var row = document.createElement('div');
    row.className = 'row' + (it.available ? '' : ' off');
    row.dataset.id = it.id;

    row.innerHTML =
      '<div>' +
        '<div class="name"><span class="dot' + (it.veg ? '' : ' nonveg') + '"></span>' + esc(it.name) + '</div>' +
        '<div class="cat">' + esc(catLabel(it.category)) + '</div>' +
      '</div>' +
      '<div class="state" aria-live="polite"></div>' +
      '<div class="controls">' +
        '<span class="price-wrap"><span class="rupee">₹</span>' +
          '<input class="price" type="number" inputmode="numeric" min="0" max="1000000" step="1" ' +
          'value="' + it.price + '" aria-label="Price for ' + esc(it.name) + '">' +
        '</span>' +
        '<button class="soldout" type="button" aria-pressed="' + String(!it.available) + '" ' +
          'aria-label="Sold out toggle for ' + esc(it.name) + '">' +
          (it.available ? 'In stock' : 'Sold out') +
        '</button>' +
      '</div>';

    var state = row.querySelector('.state');
    var priceInput = row.querySelector('.price');
    var soldBtn = row.querySelector('.soldout');

    function mark(cls, text) {
      state.className = 'state ' + cls;
      state.textContent = text;
      if (cls === 'saved') setTimeout(function () {
        if (state.textContent === text) { state.textContent = ''; state.className = 'state'; }
      }, 1800);
    }

    function patch(payload, onOk) {
      mark('saving', 'saving…');
      api('PATCH', '/api/admin/items/' + it.id, payload)
        .then(function (updated) {
          it.price = updated.price;
          it.available = updated.available;
          onOk(updated);
          mark('saved', 'saved');
        })
        .catch(function (e) {
          mark('failed', 'not saved');
          toast(errText(e), true);
        });
    }

    priceInput.addEventListener('change', function () {
      var val = parseInt(priceInput.value, 10);
      if (!isFinite(val) || val < 0) {
        priceInput.value = it.price;
        mark('failed', 'bad price');
        return;
      }
      if (val === it.price) return;
      patch({ price: val }, function (updated) { priceInput.value = updated.price; });
    });

    soldBtn.addEventListener('click', function () {
      var nextAvailable = !it.available;
      patch({ available: nextAvailable }, function (updated) {
        soldBtn.setAttribute('aria-pressed', String(!updated.available));
        soldBtn.textContent = updated.available ? 'In stock' : 'Sold out';
        row.className = 'row' + (updated.available ? '' : ' off');
        if (activeCat === '__off') renderMenu();
      });
    });

    return row;
  }

  var searchTimer;
  $('search').addEventListener('input', function () {
    var v = this.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { query = v; renderMenu(); }, 120);
  });

  /* --------------------------------------------------------------- boot -- */
  api('GET', '/api/admin/reservations')
    .then(function (data) {
      showApp();
      renderReservations(data);
      loadMenu();
    })
    .catch(function (e) {
      if (!e || e.code !== 401) showLogin();
    });
})();
</script>
</body>
</html>
